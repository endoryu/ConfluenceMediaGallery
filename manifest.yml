# Confluence Media Gallery — Forge manifest
# 方針: V1仕様書 §4.6(block layout、gallery/viewer 2 resource、egress宣言0、licensing未宣言)
# app.id は forge register(2026-09-18、ユーザー同意のもと登録)による実ID。
# app.runtime はスキーマ必須項目。Custom UIのみでFunctionは持たない(使用はFCP-MAN-FUNCTIONで恒久遮断)。
modules:
  macro:
    - key: media-gallery
      title: Media Gallery
      description: Read-only media gallery for page attachments
      layout: block
      resource: gallery
resources:
  - key: gallery
    path: dist/gallery
  - key: viewer
    path: dist/viewer
permissions:
  scopes:
    - read:attachment:confluence
    # WU-6作業6・9(1WU1manifest変更の原則で同時追加。upgrade時のscope差分はユーザー確認)
    - read:user:confluence
    - write:attachment:confluence
    # v1 attachment作成APIの必須ペア(公式docs: write:attachmentと併記)。WU-6実測401「scope does not match」への対処
    - read:content-details:confluence
app:
  id: ari:cloud:ecosystem::app/3f888a57-418d-4eb2-ba64-a138fb2eefbf
  runtime:
    name: nodejs22.x
