<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media Gallery Viewer</title>
  </head>
  <body>
    <!-- 静的shell(V1 §7.2): 暗色背景・中央contain領域・前後ボタン(44px)。
         閉じるボタンはForgeヘッダーが正のため置かない。≡はPhase 4 -->
    <div id="app">
      <div class="mgv-viewer" role="region" aria-label="メディアビューアー">
        <div class="mgv-stage">
          <img class="mgv-image" alt="" hidden />
        </div>
        <button class="mgv-nav mgv-nav--prev" type="button" aria-label="前のメディア" disabled>&#8249;</button>
        <button class="mgv-nav mgv-nav--next" type="button" aria-label="次のメディア" disabled>&#8250;</button>
        <p class="mgv-status" aria-live="polite" hidden></p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
